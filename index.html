<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Need to Talk ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="card" id="mainCard">
    <div class="emoji" id="emoji">😤</div>
    <p class="tiny">IMPORTANT MESSAGE FOR MY HUSBAND</p>
    <h1 id="title">We need to talk...</h1>
    <p class="message" id="message">
      Someone has been making his wife a little unhappy. 👀
    </p>

    <div class="buttons" id="buttons">
      <button class="sorry" id="sorryBtn">Okay, I'm Sorry ❤️</button>
      <button class="escape" id="escapeBtn">I didn't do anything 😇</button>
    </div>

    <p class="hint" id="hint">Choose wisely, husband. 😌</p>
  </main>

  <section class="forgiven hidden" id="forgiven">
    <div class="confetti" aria-hidden="true"></div>
    <div class="big-heart">❤️</div>
    <h2>Okay... you're forgiven! 🥹</h2>
    <p>But only because you're cute. 😌</p>
    <p class="final">Now come here and give your wife a hug. 🤗💕</p>
    <button onclick="location.reload()">Replay 😈</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
